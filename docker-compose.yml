services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: amuse
      POSTGRES_PASSWORD: amuse
      POSTGRES_DB: amuse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amuse"]
      interval: 2s
      timeout: 5s
      retries: 30

  amuse:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://amuse:amuse@db:5432/amuse
    # Published on localhost only: Amuse has no login, so don't expose it to your network.
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - amuse-data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  amuse-data:
