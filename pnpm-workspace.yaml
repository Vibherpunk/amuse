packages:
  - apps/*
  - lib/*

autoInstallPeers: false

catalog:
  "@tailwindcss/vite": ^4.1.14
  "@tanstack/react-query": ^5.90.21
  "@types/node": ^25.3.3
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^5.0.4
  drizzle-orm: ^0.45.2
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwindcss: ^4.1.14
  vite: ^7.3.2
  wouter: ^3.3.5

# Only install package versions that have been public for at least a day.
minimumReleaseAge: 1440

onlyBuiltDependencies:
  - esbuild

overrides:
  "@esbuild-kit/esm-loader": "-"
  "@esbuild-kit/core-utils": "-"
  body-parser@^2: ^2.4.0
  qs@^6: ^6.16.1
  brace-expansion@^5: ^5.0.12
  esbuild: 0.28.2
  fast-uri@^3: ^3.1.8
  js-yaml: 4.3.2
  proxy-addr@^2: ^2.0.8
  source-map-js@^1: ^1.2.2
